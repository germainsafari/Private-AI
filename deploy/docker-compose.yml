# Local Docker Compose only — kept out of repo root so Vercel does not enter "Services" scan mode.
# From repo root: docker compose -f deploy/docker-compose.yml up --build

services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    models:
      llm:
        endpoint_var: OPENAI_BASE_URL
        model_var: MODEL_NAME

models:
  llm:
    model: ai/gemma4:latest
