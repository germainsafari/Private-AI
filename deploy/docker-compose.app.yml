# Local Docker Model Runner compose — run from app/: docker compose -f ../deploy/docker-compose.app.yml up --build

services:
  app:
    build: .
    ports:
      - "8000:8000"
    models:
      llm:
        endpoint_var: OPENAI_BASE_URL
        model_var: MODEL_NAME

models:
  llm:
    model: ai/gemma3:latest
